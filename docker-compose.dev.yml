name: artex-dev

x-runtime: &runtime
  build:
    context: .
    dockerfile: Dockerfile.dev
  # Keep service-default image names. Giving backend and frontend one shared
  # tag makes concurrent BuildKit exports race with "image already exists".
  init: true
  working_dir: /workspace
  volumes:
    - .:/workspace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ARTEX_DEV_DB_USER:-artex}
      POSTGRES_PASSWORD: ${ARTEX_DEV_DB_PASSWORD:-artex-dev}
      POSTGRES_DB: ${ARTEX_DEV_DB_NAME:-artex}
    ports:
      - "127.0.0.1:${ARTEX_DEV_DB_PORT:-5432}:5432"
    volumes:
      - artex-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    <<: *runtime
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -ec
      - >-
        go build -o /runtime/artex-dev ./cmd/artex &&
        exec /runtime/artex-dev
        -addr :8787
        -proxy :8788
        -data /workspace/data
    environment:
      ARTEX_PG_DSN: postgres://${ARTEX_DEV_DB_USER:-artex}:${ARTEX_DEV_DB_PASSWORD:-artex-dev}@postgres:5432/${ARTEX_DEV_DB_NAME:-artex}?sslmode=disable
      ARTEX_SKILL_DIR: /workspace/skills
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "127.0.0.1:${ARTEX_DEV_API_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_DEV_PROXY_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/api/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - .:/workspace
      - artex-dev-state:/runtime
      - artex-dev-data:/workspace/data
      - artex-dev-go-mod:/go/pkg/mod
      - artex-dev-go-build:/root/.cache/go-build
    restart: "no"

  frontend:
    <<: *runtime
    depends_on:
      backend:
        condition: service_healthy
    command:
      - bash
      - -ec
      - >-
        cd web &&
        npm install --no-audit --no-fund &&
        exec npm run dev -- --hostname 0.0.0.0 --port 5173
    environment:
      AUTOPENTEST_API: http://backend:8787
      NEXT_PUBLIC_SSE_BASE: http://localhost:${ARTEX_DEV_API_PORT:-8787}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${ARTEX_DEV_WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - artex-dev-node-modules:/workspace/web/node_modules
      - artex-dev-next-cache:/workspace/web/.next
    restart: "no"

volumes:
  artex-dev-postgres:
  artex-dev-state:
  artex-dev-data:
  artex-dev-go-mod:
  artex-dev-go-build:
  artex-dev-node-modules:
  artex-dev-next-cache:
